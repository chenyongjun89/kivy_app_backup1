name: Build Kivy APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 清理环境
    - name: Clean
      run: rm -rf .buildozer

    # 1. 直接使用系统自带的 Python 3.10，不折腾版本
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev aidl

    - name: Install Buildozer and Cython
      run: |
        pip install buildozer cython
        pip install "pyjnius>=1.4.0"

    # 2. 挂载 4GB 虚拟内存，防止编译 C 库时内存溢出被杀
    - name: Create Swap Space
      run: |
        sudo swapoff -a || true
        sudo rm -f /swapfile
        sudo fallocate -l 4G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile

    # 3. 编译
    - name: Build APK
      run: yes | buildozer android debug

    # 4. 保存结果
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: kivy-apk
        path: bin/*.apk
