name: Build Kivy APK
on: [push, workflow_dispatch]

jobs:
  build:
    # 将运行环境固定为 ubuntu-22.04，这是一个长期支持版本，兼容性更好
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev aidl
        
        # ★ 核心修复：从 Kernel 镜像站下载有效的 libtinfo5 安装包
        # 该链接来自一个官方示例，稳定性较高
        wget https://mirrors.edge.kernel.org/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2ubuntu0.1_amd64.deb
        
        # （可选）校验文件完整性，确保下载无误
        echo "f04c382f877c9eab631818eadbfaa0c5 libtinfo5_6.3-2ubuntu0.1_amd64.deb" | md5sum -c --status
        
        # 安装下载的包
        sudo dpkg -i libtinfo5_6.3-2ubuntu0.1_amd64.deb

    - name: Install Buildozer and Cython
      run: |
        pip install buildozer cython
        pip install "pyjnius>=1.4.0"

    - name: Build APK
      run: echo y | buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: kivy-apk
        path: bin/*.apk
